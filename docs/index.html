<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Каталог игровых ассетов из темы Assets с поиском и фильтрацией по тегам.">
    <meta name="theme-color" content="#101016">
    <title>Assets — каталог игровых ассетов</title>
    <link rel="stylesheet" href="./styles.css?v=2">
    <script defer src="./catalog.js"></script>
    <script defer src="./gallery.js?v=2"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-content">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Assets</div>
      </div>
    </header>

    <main class="shell">
      <div class="intro">
        <h1>Каталог ассетов</h1>
        <p>Модели, окружение, интерфейсы и эффекты для игр.</p>
      </div>

      <section aria-label="Галерея ассетов">
        <div class="filter-panel">
          <div class="filter-bar">
            <button class="filter" id="all-filter" type="button">Все ассеты</button>
            <form class="search" id="asset-search-form" role="search">
              <div class="search-field">
                <input id="asset-search" type="search" aria-label="Поиск по карточкам" placeholder="Поиск по карточкам" autocomplete="off">
                <button class="search-clear" id="clear-search" type="button" aria-label="Очистить поиск" hidden>×</button>
              </div>
              <button class="search-submit" type="submit" aria-label="Найти ассеты">
                <span class="search-icon" aria-hidden="true"></span>
              </button>
            </form>
            <p class="result-count" id="result-count" role="status"></p>
          </div>
          <div class="filters" id="filters" role="group" aria-label="Фильтры по тегам"></div>
        </div>
        <ul class="gallery" id="gallery" role="list"></ul>
        <p class="empty-state" id="empty-state" hidden></p>
        <noscript><p class="empty-state">Для работы галереи нужен JavaScript.</p></noscript>
      </section>
      <button class="export-button" id="export-button" type="button" hidden>Экспорт</button>
    </main>

    <template id="asset-template">
      <li class="asset">
        <button class="asset-button" type="button" aria-haspopup="dialog">
          <span class="asset-media">
            <img class="asset-image" alt="" decoding="async">
            <span class="asset-no-preview" hidden>Без превью</span>
            <span class="asset-preview" aria-hidden="true"><span class="asset-preview-text"></span></span>
          </span>
          <span class="asset-caption">
            <span class="asset-title"></span>
            <span class="asset-tags"></span>
          </span>
        </button>
        <button class="asset-select" type="button" aria-pressed="false" title="Выбрать для экспорта">
          <span class="asset-select-icon" aria-hidden="true"></span>
        </button>
      </li>
    </template>

    <dialog id="asset-dialog" aria-labelledby="detail-title" aria-describedby="detail-description">
      <div class="detail">
        <button class="detail-close" type="button" aria-label="Закрыть описание" autofocus>×</button>
        <img class="detail-image" id="detail-image" alt="" decoding="async">
        <div class="detail-body">
          <h2 id="detail-title"></h2>
          <div class="asset-tags" id="detail-tags"></div>
          <p id="detail-description"></p>
          <div class="detail-links">
            <a class="detail-link" id="detail-link" target="_blank" rel="noopener noreferrer">Открыть пост в Telegram</a>
            <a class="detail-link" id="detail-store-link" target="_blank" rel="noopener noreferrer" hidden>Unity Asset Store</a>
          </div>
          <details id="detail-related" hidden>
            <summary>Другие публикации в Telegram</summary>
            <ul id="detail-related-links"></ul>
          </details>
        </div>
      </div>
    </dialog>
  </body>
</html>
